services:
  mysql:
    image: mysql:8.0
    container_name: microcredito-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_SENHA:-root123}
      MYSQL_DATABASE: ${DB_NOME:-microcredito}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=80
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${DB_SENHA:-root123}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  backend:
    image: node:22-alpine
    container_name: microcredito-backend
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: production
      PORTA: "3000"
      DB_HOST: mysql
      DB_PORTA: "3306"
      DB_NOME: ${DB_NOME:-microcredito}
      DB_UTILIZADOR: root
      DB_SENHA: ${DB_SENHA:-root123}
      JWT_SEGREDO: ${JWT_SEGREDO:-microcredito-local-segredo-2026}
      JWT_EXPIRA: ${JWT_EXPIRA:-12h}
      DOMINIO: ${DOMINIO:-148.230.115.150}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://148.230.115.150,http://localhost:5173}
      SEMEAR_ADMIN_TESTE: ${SEMEAR_ADMIN_TESTE:-false}
      ADMIN_SENHA_INICIAL: ${ADMIN_SENHA_INICIAL:-}
    command:
      - sh
      - -c
      - apk add --no-cache git && git clone --depth 1 --branch main https://github.com/Antoniojoaozimila/projecto_microcredito.git /tmp/src && cp -a /tmp/src/backend/. /app/ && npm ci --omit=dev && node src/servidor.js
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: microcredito-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://148.230.115.150:3000}
    command:
      - sh
      - -c
      - apk add --no-cache git && rm -rf /src && git clone --depth 1 --branch main https://github.com/Antoniojoaozimila/projecto_microcredito.git /src && cd /src/frontend && npm ci && npm run build && npx --yes serve -s dist -l tcp://0.0.0.0:80
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
