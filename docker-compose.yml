version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: microcredito-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_SENHA:-root123}
      MYSQL_DATABASE: ${DB_NOME:-microcredito}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=80
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${DB_SENHA:-root123}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  backend:
    build: ./backend
    container_name: microcredito-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORTA: "3000"
      DB_HOST: mysql
      DB_PORTA: "3306"
      DB_NOME: ${DB_NOME:-microcredito}
      DB_UTILIZADOR: root
      DB_SENHA: ${DB_SENHA:-root123}
      JWT_SEGREDO: ${JWT_SEGREDO:-microcredito-local-segredo-2026}
      JWT_EXPIRA: ${JWT_EXPIRA:-12h}
      DOMINIO: ${DOMINIO:-148.230.115.150}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://148.230.115.150,http://localhost:5173}
      SEMEAR_ADMIN_TESTE: ${SEMEAR_ADMIN_TESTE:-false}
      ADMIN_SENHA_INICIAL: ${ADMIN_SENHA_INICIAL:-}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://148.230.115.150:3000}
    container_name: microcredito-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  mobile:
    build:
      context: ./mobile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://148.230.115.150:3000}
    container_name: microcredito-mobile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql-data:
